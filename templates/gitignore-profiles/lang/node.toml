# Node.js — gitignore profile.
# Generated by tools/generators/profile_registry.py (T-G-015).
# Hand-edits are discouraged; regenerate via
# `python tools/generators/all.py --only T-G-015 --write`.

[profile]
name = "lang/node"
display_name = "Node.js"
category = "lang"
version = "1.0.0"
maintainer = "Simtabi LLC <opensource@simtabi.com>"
upstream_source = "https://github.com/github/gitignore/blob/main/Node.gitignore"

[detect]
required_any = [
    "package.json",
    "package-lock.json",
    "yarn.lock",
    "pnpm-lock.yaml",
    "bun.lockb",
]
boost_any = [
    "npm-shrinkwrap.json",
    ".nvmrc",
]

[patterns]
always = [
    "node_modules/",
    "npm-debug.log*",
    "yarn-debug.log*",
    "yarn-error.log*",
]
dev_only = [
    ".npm/",
    ".yarn/",
    ".pnp.*",
    "dist/",
    "build/",
    "coverage/",
    ".next/",
    ".nuxt/",
    ".output/",
]
prod_only = []

[extends]
profiles = []
