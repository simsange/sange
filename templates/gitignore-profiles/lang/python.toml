# Python — gitignore profile.
# Generated by tools/generators/profile_registry.py (T-G-015).
# Hand-edits are discouraged; regenerate via
# `python tools/generators/all.py --only T-G-015 --write`.

[profile]
name = "lang/python"
display_name = "Python"
category = "lang"
version = "1.0.0"
maintainer = "Simtabi LLC <opensource@simtabi.com>"
upstream_source = "https://github.com/github/gitignore/blob/main/Python.gitignore"

[detect]
required_any = [
    "pyproject.toml",
    "setup.py",
    "requirements.txt",
    "Pipfile",
]
boost_any = [
    ".python-version",
    "uv.lock",
    "poetry.lock",
    "Pipfile.lock",
]

[patterns]
always = [
    "__pycache__/",
    "*.py[cod]",
    "*$py.class",
    ".Python",
    "*.so",
]
dev_only = [
    ".venv/",
    "venv/",
    "env/",
    ".tox/",
    ".ruff_cache/",
    ".mypy_cache/",
    ".pytest_cache/",
    "htmlcov/",
    ".coverage",
    ".coverage.*",
    "dist/",
    "build/",
    "*.egg-info/",
]
prod_only = []

[extends]
profiles = []
