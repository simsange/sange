; mypy — Sange v3 type-check configuration.
;
; Strict-mode per the Simtabi org convention (CLAUDE.md global). Pydantic v2's
; mypy plugin is enabled so SangeConfig and the lifecycle models type-check
; their .model_validate / .model_dump signatures correctly (introduced in T-002).

[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
implicit_reexport = False
show_error_codes = True
show_column_numbers = True
pretty = True

plugins = pydantic.mypy

namespace_packages = True
explicit_package_bases = True
mypy_path = src

exclude = (?x)(
    ^\.design/.*$
    | ^sange-v1/.*$
    | ^sange-v2/.*$
    | ^build/.*$
    | ^dist/.*$
  )

; Third-party libraries lacking type stubs — mark missing-imports tolerable on
; a case-by-case basis as the codebase grows. Anything added here gets a
; pyproject.toml comment explaining why.
[mypy-keyring.*]
ignore_missing_imports = True

[mypy-magic.*]
ignore_missing_imports = True

[mypy-questionary.*]
ignore_missing_imports = True

[mypy-shellingham.*]
ignore_missing_imports = True

[mypy-wcwidth.*]
ignore_missing_imports = True

; Pydantic plugin tuning.
[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
