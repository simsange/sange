# Sange v3 — Python package metadata.
#
# Conventions:
#   - Build backend: hatchling (Simtabi LLC org default; no setup.py).
#   - Version is single-sourced from src/sange/_version.py.
#   - Library deps use `>=` floors that uv.lock pins exactly.
#   - Apache-2.0 per ADR-007.
#   - Library stack pinned by ADR-019 (typer + rich + questionary + textual + structlog
#     + wcwidth + shellingham + python-magic + stdlib asyncio/subprocess). Disallowed
#     by default: tqdm, colorama, inquirer, loguru, plumbum, sh, click.
#   - `[project.scripts]` entry-point is declared in T-040 (Typer skeleton); deliberately
#     omitted here so the T-001 scaffolding only ships installable metadata, no runtime.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sange"
dynamic = ["version"]
description = "Local-first developer-experience layer between humans and their version-control systems."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "vcs",
    "git",
    "svn",
    "developer-tools",
    "devex",
    "cli",
    "tui",
    "ai",
    "commit-messages",
    "release-engineering",
    "sbom",
    "slsa",
    "sigstore",
    "mcp",
]
authors = [{ name = "Simtabi LLC", email = "opensource@simtabi.com" }]
maintainers = [{ name = "Imani Manyara", email = "imani@simtabi.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Version Control",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    # CLI surface (ADR-019)
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
    # Terminal-aware presentation (§7.0)
    "wcwidth>=0.2.13",
    "shellingham>=1.5.4",
    # Subsystems used by every command
    "structlog>=24.1",
    "python-magic>=0.4.27",
    # Config + domain model (§6.3, §8)
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # Secrets storage (§6.10)
    "keyring>=24.0",
    # TOML writing (Python 3.12 has tomllib for reading; writing needs an external lib)
    "tomli-w>=1.0",
    # Typing helpers — keeps the runtime typing surface on a known floor across CPython 3.12+
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
# Interactive TUI app (sange tui). textual is heavy and only loaded when the TUI runs.
tui = ["textual>=0.50"]

# AI providers — each installs its provider SDK on demand (sange[ai-anthropic], etc.).
# Keeping these as extras avoids pulling 100+ MB of optional SDKs on every install.
ai-anthropic = ["anthropic>=0.30"]
ai-openai = ["openai>=1.30"]
ai-ollama = ["ollama>=0.2"]
ai-google = ["google-genai>=0.3"]
ai-bedrock = ["boto3>=1.34"]

# Convenience meta-extra: install Sange with every AI provider's SDK.
ai-all = [
    "anthropic>=0.30",
    "openai>=1.30",
    "ollama>=0.2",
    "google-genai>=0.3",
    "boto3>=1.34",
]

# Development tooling (test + lint + types + hooks).
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "hatchling>=1.24",
]

[project.urls]
Homepage = "https://opensource.simtabi.com/products/sange"
Documentation = "https://opensource.simtabi.com/documentation/sange"
Repository = "https://github.com/simtabi/sange"
Issues = "https://github.com/simtabi/sange/issues"
Changelog = "https://github.com/simtabi/sange/blob/main/CHANGELOG.md"
"Security Policy" = "https://github.com/simtabi/sange/security/policy"

# CLI entry-points — landed in T-040. `pip install -e .` exposes `sange`
# on PATH; the entry resolves to `sange.cli.app` which is the typer App.
[project.scripts]
sange = "sange.cli:app"

[tool.hatch.version]
path = "src/sange/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sange"]

[tool.hatch.build.targets.sdist]
include = [
    "src/sange",
    "LICENSE",
    "NOTICE",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
    "AUTHORS.md",
    "pyproject.toml",
    "ruff.toml",
    "mypy.ini",
    "tests",
]
exclude = [
    ".design",
    "sange-v1",
    "sange-v2",
    "*.pyc",
    "__pycache__",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
asyncio_mode = "auto"
markers = [
    "unit: pure-Python tests with no subprocess or filesystem mutation",
    "integration: tests that spawn subprocesses or mutate the filesystem under tmp",
    "e2e: end-to-end CLI invocations against real fixture repos",
    "security: prompt-injection corpus + SLSA / sigstore verification",
    "slow: tests that take more than a second; opt-in via -m slow",
]

[tool.coverage.run]
source = ["src/sange"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
