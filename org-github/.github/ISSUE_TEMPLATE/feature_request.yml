name: Feature request
description: Propose a new feature or enhancement.
title: "[feat] "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. **Larger proposals are
        better discussed in [Discussions](https://github.com/orgs/simsange/discussions)
        first** — that's where alignment happens. Use this issue
        template once the discussion has reached "yes, build it".

  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving?
      description: |
        Concrete user-facing situation. Not "I want feature X" but
        "I'm trying to do Y and currently can't because Z".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        How would the feature work? Sketch the CLI flag / API shape /
        UI flow at the level of detail you have.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Other approaches you weighed + why you landed on the proposal.

  - type: textarea
    id: scope
    attributes:
      label: Scope + non-scope
      description: |
        What's explicitly NOT included in this proposal? Helps the
        reviewer focus on what matters.

  - type: dropdown
    id: priority
    attributes:
      label: How urgent is this for you?
      options:
        - "Nice to have"
        - "Useful — I'd build it myself if I had time"
        - "Blocking my workflow — I need this to use the tool"
    validations:
      required: true

  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight
      options:
        - label: I've searched existing issues + discussions and this isn't a duplicate.
          required: true
        - label: I've read the [Code of Conduct](https://github.com/simsange/.github/blob/main/CODE_OF_CONDUCT.md).
          required: true
        - label: I'm open to discussion + iteration on the proposal shape.
          required: true
