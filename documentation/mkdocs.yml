site_name: Sange
site_description: >-
  Local-first developer-experience layer between humans and their
  version-control systems. Eliminating boilerplate, enforcing safety,
  embedding AI assistance into every commit, branch, and release.
site_author: Simtabi LLC
site_url: https://opensource.simtabi.com/documentation/sange

repo_name: sangedev/sange
repo_url: https://github.com/sangedev/sange
edit_uri: edit/main/documentation/docs/

copyright: Copyright © Simtabi LLC. Apache License 2.0.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    # Light mode.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode — respects NO_COLOR / system preference.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - CLI:
      - cli/index.md
      - sange commit: cli/commit.md
      - sange commits: cli/commits.md
      - sange doctor: cli/doctor.md
      - sange init: cli/init.md
      - sange ai: cli/ai.md
  - Architecture:
      - architecture/index.md
      - Audit chain: architecture/audit-chain.md
      - Redaction (T-030): architecture/redaction.md
  - Reference:
      - Full CLI reference (auto-generated): https://github.com/sangedev/sange/blob/main/docs/reference/cli-reference.md
      - Exit codes: https://github.com/sangedev/sange/blob/main/docs/reference/exit-codes.md
      - Threat model (STRIDE): https://github.com/sangedev/sange/blob/main/docs/security/stride.md
      - Architecture decisions (ADRs): https://github.com/sangedev/sange/tree/main/docs/adr
  - Changelog: https://github.com/sangedev/sange/blob/main/docs/CHANGELOG.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sangedev
      name: sangedev on GitHub
  generator: false
